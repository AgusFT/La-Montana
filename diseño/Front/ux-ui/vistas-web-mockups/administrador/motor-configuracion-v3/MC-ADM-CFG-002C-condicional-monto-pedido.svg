<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#18324b}.h{font-size:34px;font-weight:700}.s{font-size:20px;fill:#52677b}.t{font-size:23px;font-weight:700}.b{font-size:18px}.n{font-size:16px;fill:#5c7084}.blue{fill:#0b67e8}.green{fill:#0b8a52}.red{fill:#c43b3b}</style><text x="65" y="55" class="h">Motor de configuración</text><text x="65" y="85" class="s">Configuración operativa versionada de la imprenta</text><text x="250" y="155" class="h">Fase 2 · Condiciones de aprobación</text><text x="250" y="190" class="s">Estructuras certificadas y recorrido de decisión</text><text x="250" y="235" class="t blue">CFG-002B · Elegir condición de aprobación</text><rect x="90" y="255" rx="22" width="420" height="160" fill="#ffffff" stroke="#ccd8e4" stroke-width="2"/><text x="112" y="292" class="t">Aprobación por pago previo</text><text x="112" y="330" class="b">Pago total acreditado antes de procesar</text><rect x="540" y="255" rx="22" width="420" height="160" fill="#ffffff" stroke="#ccd8e4" stroke-width="2"/><text x="562" y="292" class="t">Aprobación por pago de seña</text><text x="562" y="330" class="b">Seña requerida antes de procesar</text><rect x="990" y="255" rx="22" width="420" height="160" fill="#d9efff" stroke="#0b67e8" stroke-width="4"/><text x="1012" y="292" class="t">Aprobación por monto del pedido</text><text x="1012" y="330" class="b">Autoaprobación debajo del umbral</text><rect x="1276" y="270" rx="10" width="112" height="30" fill="#dff7e9"/><text x="1290" y="291" class="n green">SELECCIONADO</text><text x="250" y="460" class="t blue">CFG-003 · Simulación del recorrido</text><rect x="250" y="485" rx="26" width="1280" height="310" fill="#effbf4" stroke="#8bd2a8" stroke-width="2"/><text x="280" y="525" class="t">Aprobación por monto del pedido</text><text x="280" y="555" class="s">Ejemplo con la configuración actual</text><rect x="290" y="595" rx="16" width="180" height="105" fill="#ffffff" stroke="#bfd0e0" stroke-width="2"/><circle cx="315" cy="620" r="15" fill="#0b67e8"/><text x="310" y="626" font-size="15" fill="white">1</text><text x="308" y="660" class="b">Pedido</text><text x="308" y="685" class="b">recibido</text><text x="475" y="655" font-size="35" fill="#718096">→</text><rect x="495" y="595" rx="16" width="180" height="105" fill="#ffffff" stroke="#bfd0e0" stroke-width="2"/><circle cx="520" cy="620" r="15" fill="#0b67e8"/><text x="515" y="626" font-size="15" fill="white">2</text><text x="513" y="660" class="b">Validaciones</text><text x="513" y="685" class="b">técnicas</text><text x="680" y="655" font-size="35" fill="#718096">→</text><rect x="700" y="595" rx="16" width="180" height="105" fill="#ffffff" stroke="#bfd0e0" stroke-width="2"/><circle cx="725" cy="620" r="15" fill="#0b67e8"/><text x="720" y="626" font-size="15" fill="white">3</text><text x="718" y="660" class="b">Calcular</text><text x="718" y="685" class="b">monto</text><text x="885" y="655" font-size="35" fill="#718096">→</text><rect x="905" y="595" rx="16" width="180" height="105" fill="#e8f6ee" stroke="#7fc99d" stroke-width="2"/><circle cx="930" cy="620" r="15" fill="#0b67e8"/><text x="925" y="626" font-size="15" fill="white">4</text><text x="923" y="660" class="b">Dentro</text><text x="923" y="685" class="b">del umbral</text><text x="1090" y="655" font-size="35" fill="#718096">→</text><rect x="1110" y="595" rx="16" width="180" height="105" fill="#e8f6ee" stroke="#7fc99d" stroke-width="2"/><circle cx="1135" cy="620" r="15" fill="#0b67e8"/><text x="1130" y="626" font-size="15" fill="white">5</text><text x="1128" y="660" class="b">Autoaprobación</text><text x="1128" y="685" class="b"></text><text x="1295" y="655" font-size="35" fill="#718096">→</text><rect x="1315" y="595" rx="16" width="180" height="105" fill="#e8f6ee" stroke="#7fc99d" stroke-width="2"/><circle cx="1340" cy="620" r="15" fill="#0b67e8"/><text x="1335" y="626" font-size="15" fill="white">6</text><text x="1333" y="660" class="b">Continúa</text><text x="1333" y="685" class="b">flujo</text><text x="280" y="755" class="b">Si el monto supera el umbral configurado, el pedido pasa a revisión humana.</text><rect x="1190" y="815" rx="16" width="340" height="55" fill="#fff8e8" stroke="#e99a18" stroke-width="2"/><text x="1240" y="850" class="t">Configurar Pagos y Señas</text></svg>