<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#18324b}.h{font-size:34px;font-weight:700}.s{font-size:20px;fill:#52677b}.t{font-size:23px;font-weight:700}.b{font-size:18px}.n{font-size:16px;fill:#5c7084}.blue{fill:#0b67e8}.green{fill:#0b8a52}</style><text x="65" y="55" class="h">Motor de configuración</text><text x="65" y="85" class="s">Configuración operativa versionada de la imprenta</text><text x="250" y="155" class="h">Fase 2 · Modelo operativo y aprobación</text><text x="250" y="190" class="s">Estructuras certificadas y recorrido de decisión</text><text x="250" y="235" class="t blue">CFG-002 · Elegir modo de operación</text><rect x="250" y="255" rx="22" width="390" height="170" fill="#d9efff" stroke="#0b67e8" stroke-width="4"/><text x="275" y="295" class="t">Control manual</text><text x="275" y="335" class="b">Revisión humana obligatoria</text><text x="275" y="365" class="b">Aprobación o rechazo manual</text><rect x="505" y="272" rx="10" width="112" height="30" fill="#dff7e9"/><text x="519" y="293" class="n green">SELECCIONADO</text><rect x="665" y="255" rx="22" width="390" height="170" fill="#ffffff" stroke="#ccd8e4" stroke-width="2"/><text x="690" y="295" class="t">Control condicional</text><text x="690" y="335" class="b">Reglas certificadas determinan intervención</text><text x="690" y="365" class="b">Aprobación automática bajo condiciones</text><rect x="1080" y="255" rx="22" width="390" height="170" fill="#ffffff" stroke="#ccd8e4" stroke-width="2"/><text x="1105" y="295" class="t">Automatización certificada</text><text x="1105" y="335" class="b">Evolución futura</text><text x="1105" y="365" class="b">Visible pero deshabilitada</text><text x="250" y="470" class="t blue">CFG-003 · Simulación del recorrido manual</text><rect x="250" y="495" rx="26" width="1280" height="280" fill="#effbf4" stroke="#8bd2a8" stroke-width="2"/><text x="280" y="535" class="t">Ruta manual</text><text x="280" y="565" class="s">Todos los pedidos requieren intervención humana antes de quedar aprobados.</text><rect x="300" y="610" rx="16" width="190" height="100" fill="#ffffff" stroke="#bfd0e0"/><text x="330" y="650" class="t">1 · Pedido</text><text x="330" y="680" class="b">recibido</text><text x="500" y="665" font-size="34" fill="#718096">→</text><rect x="540" y="610" rx="16" width="220" height="100" fill="#ffffff" stroke="#bfd0e0"/><text x="570" y="650" class="t">2 · Validaciones</text><text x="570" y="680" class="b">técnicas obligatorias</text><text x="770" y="665" font-size="34" fill="#718096">→</text><rect x="810" y="610" rx="16" width="220" height="100" fill="#fff8e8" stroke="#e1b85c"/><text x="840" y="650" class="t">3 · Revisión</text><text x="840" y="680" class="b">humana obligatoria</text><text x="1040" y="665" font-size="34" fill="#718096">→</text><rect x="1080" y="610" rx="16" width="220" height="100" fill="#ffffff" stroke="#bfd0e0"/><text x="1110" y="650" class="t">4 · Decisión</text><text x="1110" y="680" class="b">aprobar o rechazar</text><text x="1310" y="665" font-size="34" fill="#718096">→</text><rect x="1350" y="610" rx="16" width="150" height="100" fill="#e8f6ee" stroke="#7fc99d"/><text x="1375" y="650" class="t">5 · Sigue</text><text x="1375" y="680" class="b">si se aprueba</text><rect x="1190" y="805" rx="16" width="340" height="55" fill="#fff8e8" stroke="#e99a18" stroke-width="2"/><text x="1240" y="840" class="t">Configurar Pagos y Señas</text></svg>