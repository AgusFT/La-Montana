name: lamontana

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: lamontana
      POSTGRES_USER: lamontana
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Ejecutar ./infra/iniciar-local.sh para crear .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lamontana -d lamontana"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/lamontana
      DB_USER: lamontana
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      WEB_SOURCE_DIR: /app/web-entrada
      WEB_SOURCE_HOST: ${WEB_SOURCE_DIR:-${PWD}/datos/imagenes-web/entrada}
      WEB_LIBRARY_DIR: /app/imagenes-web
      FILES_DIR: /app/archivos
      PDF_INSPECTOR_JAR: /app/app.jar
      CLAMAV_HOST: antivirus
      CLAMAV_PORT: "3310"
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      SESSION_COOKIE_SECURE: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: ${SMTP_FROM:-noreply@lamontana.local}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    networks: [default, analisis]
    volumes:
      - archivos_data:/app/archivos
      - imagenes_web_data:/app/imagenes-web
      - type: bind
        source: ${WEB_SOURCE_DIR:-./datos/imagenes-web/entrada}
        target: /app/web-entrada
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  antivirus:
    build: ./infra/antivirus
    networks: [analisis]
    volumes:
      - antivirus_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--config-file=/etc/clamav/clamd.conf", "--ping=1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 360s
    mem_limit: 4g
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.0
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mail_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  archivos_data:
  imagenes_web_data:
  mail_data:
  antivirus_data:

networks:
  analisis:
