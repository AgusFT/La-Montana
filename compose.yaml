name: lamontana

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: lamontana
      POSTGRES_USER: lamontana
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Ejecutar ./infra/iniciar-local.sh para crear .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lamontana -d lamontana"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/lamontana
      DB_USER: lamontana
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      FILES_DIR: /app/archivos
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - archivos_data:/app/archivos
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.0
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mail_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  archivos_data:
  mail_data:
