x-servicio: &servicio
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  labels:
    ar.com.lamontana.instalacion: ${INSTALLATION_ID}
services:
  postgres:
    <<: *servicio
    image: ${IMAGE_POSTGRES}
    pull_policy: never
    environment:
      POSTGRES_DB: lamontana_demo
      POSTGRES_USER: lamontana_demo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lamontana_demo -d lamontana_demo"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    <<: *servicio
    image: ${IMAGE_BACKEND}
    pull_policy: never
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/lamontana_demo
      DB_USER: lamontana_demo
      DB_PASSWORD: ${DB_PASSWORD}
      LAMONTANA_MODO: DEMO
      DEMO_VIGENCIA_DIR: /app/vigencia
      SERVER_SERVLET_SESSION_COOKIE_NAME: LAMONTANA_DEMO_SESSION
      SESSION_COOKIE_SECURE: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@demo.lamontana.local
      FILES_DIR: /app/archivos
      WEB_SOURCE_DIR: /app/web-entrada
      WEB_SOURCE_HOST: ${WEB_SOURCE_DIR}
      WEB_LIBRARY_DIR: /app/imagenes-web
      PDF_INSPECTOR_JAR: /app/app.jar
      CLAMAV_HOST: antivirus
      CLAMAV_PORT: "3310"
    ports: ["127.0.0.1:${CONTROL_PORT}:8080"]
    volumes:
      - type: bind
        source: ${DEMO_VIGENCIA_HOST:?Falta la carpeta de vigencia del equipo}
        target: /app/vigencia
        bind: {create_host_path: false}
      - archivos_data:/app/archivos
      - imagenes_web_data:/app/imagenes-web
      - type: bind
        source: ${WEB_SOURCE_DIR}
        target: /app/web-entrada
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      postgres: {condition: service_healthy}
      antivirus: {condition: service_healthy}
      mailpit: {condition: service_started}
  frontend:
    <<: *servicio
    image: ${IMAGE_FRONTEND}
    pull_policy: never
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
    ports: ["127.0.0.1:${APP_PORT}:3000"]
    depends_on:
      backend: {condition: service_healthy}
  antivirus:
    <<: *servicio
    image: ${IMAGE_ANTIVIRUS}
    pull_policy: never
    environment:
      LAMONTANA_MODO: DEMO
    volumes: [antivirus_data:/var/lib/clamav]
    mem_limit: 4g
  mailpit:
    <<: *servicio
    image: ${IMAGE_MAILPIT}
    pull_policy: never
    ports: ["127.0.0.1:${MAILPIT_PORT}:8025"]
    environment: {MP_DATABASE: /data/mailpit.db}
    volumes: [mail_data:/data]

volumes:
  postgres_data:
  archivos_data:
  imagenes_web_data:
  antivirus_data:
  mail_data:
