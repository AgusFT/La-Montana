spring:
  application:
    name: lamontana
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: lamontana.sesion_http
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  flyway:
    default-schema: lamontana
    schemas: lamontana
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: lamontana
        jdbc:
          time_zone: UTC
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
lamontana:
  instalacion:
    token: ${SETUP_TOKEN:}
  archivos:
    directorio: ${FILES_DIR:./var/archivos}
